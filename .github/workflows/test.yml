# Tests on every push and pull request: predict.py against a pretend
# llama-server. No model, no credentials.
name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest==8.3.4
      - run: python -m pytest -q
